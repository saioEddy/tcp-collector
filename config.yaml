# TCP数据采集器配置文件

# TCP服务器配置
tcp:
  # 监听端口列表,可配置多个
  ports:
    - 9001
    - 9002
  # 每个端口对应的设备ID(顺序对应ports)
  device_ids:
    - "VKTCP-001"
    - "VKTCP-002"
  # 数据帧长度(字节)
  frame_length: 71
  # 读取超时时间(秒)
  read_timeout: 30
  # 连接空闲超时(秒)
  idle_timeout: 300

# Kafka配置
kafka:
  # Kafka broker地址列表
  brokers:
    - "10.57.254.20:9092"
  # 目标topic
  topic: "sensor_data"
  # 是否启用批量发送
  batch_enabled: false
  # 批量大小
  batch_size: 100
  # 批量超时时间(毫秒)
  batch_timeout: 1000
  # 是否启用压缩
  compression: "snappy"  # none/gzip/snappy/lz4/zstd
  # 最大重试次数
  max_retries: 3

# 日志配置
log:
  # 日志级别: debug/info/warn/error
  level: "info"
  # 日志输出: console/file/both
  output: "both"
  # 日志文件路径(当output为file或both时)
  file_path: "/var/log/tcp-collector/collector.log"
  # 日志文件最大大小(MB)
  max_size: 100
  # 日志文件保留天数
  max_days: 7

# 数据解析配置文件路径
parser:
  # 解析结构定义文件
  struct_file: "./parse_struct.txt"
